<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCANO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;

        }
        header {
            background-color: #111726;
            height: 50px;
            color: #fff;
            padding: 1rem;
            text-align: center;
            display: flex;
            align-items: center;
        }
        #oval-bar {
            width: 260px;
            height: 20px;
            border: 1px solid #1c2021;
            border-radius: 10px;
            margin: 20px auto;
            margin-inline: auto;
            display: flex;
            text-align: center;
            justify-content: center;
            align-items: center;
            color:transparent;
            text-shadow: 0 0 0 #75B7B4;
            gap: 2px;
        } 
        #oval-bar p{
            margin: 0;
            font-family:'Manrope', sans-serif;
            font-size: 14px; 
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="LOCANO Logo" width="30" height="30">
        <h1 style="font-size: 30px;">LOCANO</h1>
        <h1 style="margin-left: auto;font-size: 30px;color:#185767">&#9776;</h1>
    </header>

    <main>

        <div id="oval-bar">
            <img src="rocket.png" alt="Rocket Icon" width="16px" height="auto">
            <p>PRE-LAUNCH </p>
            <p>&middot;</p>
            <p style="color: #000;">COMING SOON</p>
        </div>

        <div>
            <h1>The Future of</h1>
            <h1 style="color: #185767;">Local Discovery.</h1>
            <h3>Locano connects you with the best places, events, and businesses around you.</h3>
            <h3>Smarter.Faster.Local.</h3>
        </div>

        <img src="city-silhouette.jpg" alt="City Silhouette" style="width: 100%; height: auto;">
    </main>
</body>
</html>
