<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=Bricolage+Grotesque:wght@400;700&display=swap" rel="stylesheet">
    <title>locano</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden;
        }
        img {
            position: fixed;
            top: 50%;
            left: 50%;
            height: 85px;
            width: auto;
            animation: fadeIn 2.5s ease-in-out both,
                       moveToCorner 7s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes moveToCorner {
            0%   { transform: translate(-50%, -50%); height: 85px; }
            45%  { transform: translate(-50%, -50%); height: 85px; }
            100% { transform: translate(-50%, -50%) translate(calc(-50vw + 50px), calc(-50vh + 118px)); height: 50px; }
        }

        /* Text container: anchored right next to the logo's final resting spot,
           NOT centered on the whole screen */
        #page-content {
            position: fixed;
            top: 57px;
            left: 90px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            opacity: 0;
            animation: fadeInContent 0.4s ease-in-out forwards;
            animation-delay: 7s; /* becomes visible right as logo settles */
        }
        @keyframes fadeInContent {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .reveal-wrap {
            position: relative;
            display: inline-block;
            overflow: hidden;
        }
        .reveal-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            line-height: 1;
            font-weight: 700;
            color: #1E2A4A;
            margin: 0;
            transform: translateX(-100%);
            animation: slideInText 0.8s ease forwards;
            animation-delay: 7s; /* matches logo landing, not 0.5s anymore */
        }
        .reveal-wrap::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #141B33;
            transform: translateX(-100%);
            animation: slideMask 0.8s ease forwards;
            animation-delay: 7s; /* stays in sync with the text above */
        }
        @keyframes slideInText {
            to { transform: translateX(0); }
        }
        @keyframes slideMask {
            0%   { transform: translateX(-100%); }
            50%  { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="Logo">
    <div id="page-content">
        <div class="reveal-wrap">
            <p class="reveal-text">LOCANO</p>
        </div>
    </div>
</body>
